name: Sync Knowledge Base

on:
  push:
    branches:
      - main
    paths:
      - "knowledge-base/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sync-knowledge-base
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sync dependencies
        run: python -m pip install --upgrade boto3

      - name: Sync documents to S3
        run: |
          aws s3 sync knowledge-base/ "s3://${{ secrets.KNOWLEDGE_BASE_BUCKET_NAME }}/${{ secrets.KNOWLEDGE_BASE_S3_PREFIX }}/" \
            --delete \
            --exclude "*" \
            --include "*.md"

      - name: Start Bedrock ingestion
        run: |
          python scripts/sync_knowledge_base.py \
            --knowledge-base-id "${{ secrets.BEDROCK_KNOWLEDGE_BASE_ID }}" \
            --data-source-id "${{ secrets.BEDROCK_DATA_SOURCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --wait \
            --poll-seconds 15
